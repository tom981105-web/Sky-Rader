<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Radar - 실시간 항공기 지도</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; color: white; }
    #map { width: 100vw; height: 100vh; }

    .panel {
      position: fixed; top: 16px; left: 16px; z-index: 999;
      width: 365px; max-width: calc(100vw - 32px);
      padding: 16px; border-radius: 22px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      max-height: calc(100vh - 32px); overflow-y: auto;
    }

    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 12px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat { padding: 10px; border-radius: 14px; background: rgba(30,41,59,0.92); }
    .stat b { display: block; font-size: 19px; color: #38bdf8; }
    .stat span { font-size: 12px; color: #94a3b8; }

    .section-title { margin: 12px 0 8px; font-size: 13px; color: #bae6fd; font-weight: 700; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      border: 1px solid rgba(148,163,184,0.3);
      background: #0f172a; color: #e2e8f0;
      padding: 9px 11px; border-radius: 999px;
      cursor: pointer; font-size: 13px;
    }

    button:hover { background: #1e293b; }
    .primary { background: #0284c7; border-color: #38bdf8; color: white; }

    .status { margin-top: 10px; font-size: 12px; color: #94a3b8; line-height: 1.5; }

    .plane-icon {
      font-size: 23px;
      transform-origin: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    .airport-icon {
      font-size: 22px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
    }

    .popup { min-width: 240px; font-size: 13px; line-height: 1.55; }
    .popup b { color: #0284c7; font-size: 15px; }

    .plane-card {
      width: 100%;
      height: 125px;
      border-radius: 12px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
      padding: 10px;
    }

    .plane-img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      border-radius: 12px;
      margin: 8px 0;
      background: #e2e8f0;
    }

    .search-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .panel { top: 10px; left: 10px; right: 10px; width: auto; }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <section class="panel">
    <h1>✈️ Sky Radar</h1>
    <p>10초마다 새 데이터를 받고, 비행기는 9초 동안 부드럽게 이동합니다.</p>

    <div class="stats">
      <div class="stat">
        <b id="planeCount">0</b>
        <span>표시 항공기</span>
      </div>
      <div class="stat">
        <b id="lastUpdate">-</b>
        <span>마지막 갱신</span>
      </div>
    </div>

    <div class="buttons">
      <button class="primary" onclick="loadAircraft()">새로고침</button>
      <button onclick="toggleAirports()">공항 표시/숨김</button>
      <button onclick="goMyLocation()">내 주변</button>
    </div>

    <div class="section-title">🇰🇷 한국 공항</div>
    <div class="buttons">
      <button onclick="moveTo(37.4602, 126.4407, 9)">인천</button>
      <button onclick="moveTo(37.5583, 126.7906, 10)">김포</button>
      <button onclick="moveTo(33.5113, 126.4930, 10)">제주</button>
      <button onclick="moveTo(35.1796, 128.9382, 10)">김해</button>
      <button onclick="moveTo(35.8941, 128.6589, 10)">대구</button>
      <button onclick="moveTo(36.7166, 127.4991, 10)">청주</button>
      <button onclick="moveTo(35.1232, 126.8054, 10)">광주</button>
      <button onclick="moveTo(34.8423, 127.6169, 10)">여수</button>
    </div>

    <div class="section-title">🌍 해외 주요 공항</div>
    <div class="buttons">
      <button onclick="moveTo(35.5494, 139.7798, 9)">하네다</button>
      <button onclick="moveTo(35.7720, 140.3929, 9)">나리타</button>
      <button onclick="moveTo(40.6413, -73.7781, 9)">뉴욕 JFK</button>
      <button onclick="moveTo(33.9416, -118.4085, 9)">LA</button>
      <button onclick="moveTo(51.4700, -0.4543, 9)">히드로</button>
      <button onclick="moveTo(48.3538, 11.7861, 9)">뮌헨</button>
      <button onclick="moveTo(25.2532, 55.3657, 9)">두바이</button>
      <button onclick="moveTo(1.3644, 103.9915, 9)">싱가포르</button>
    </div>

    <div class="status" id="status">지도를 불러오는 중...</div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map", { zoomControl: false }).setView([37.4602, 126.4407], 8);

    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const aircraftLayer = L.layerGroup().addTo(map);
    const airportLayer = L.layerGroup().addTo(map);
    const aircraftMarkers = new Map();
    const aircraftImageCache = new Map();

    let airportsVisible = true;
    let isLoadingAircraft = false;

    const planeCountEl = document.getElementById("planeCount");
    const lastUpdateEl = document.getElementById("lastUpdate");
    const statusEl = document.getElementById("status");

    const airports = [
      ["인천국제공항", 37.4602, 126.4407, "ICN"],
      ["김포국제공항", 37.5583, 126.7906, "GMP"],
      ["제주국제공항", 33.5113, 126.4930, "CJU"],
      ["김해국제공항", 35.1796, 128.9382, "PUS"],
      ["대구국제공항", 35.8941, 128.6589, "TAE"],
      ["청주국제공항", 36.7166, 127.4991, "CJJ"],
      ["광주공항", 35.1232, 126.8054, "KWJ"],
      ["여수공항", 34.8423, 127.6169, "RSU"],
      ["울산공항", 35.5935, 129.3517, "USN"],
      ["포항경주공항", 35.9879, 129.4204, "KPO"],
      ["양양국제공항", 38.0613, 128.6692, "YNY"],
      ["도쿄 하네다", 35.5494, 139.7798, "HND"],
      ["도쿄 나리타", 35.7720, 140.3929, "NRT"],
      ["오사카 간사이", 34.4347, 135.2440, "KIX"],
      ["뉴욕 JFK", 40.6413, -73.7781, "JFK"],
      ["LA 국제공항", 33.9416, -118.4085, "LAX"],
      ["런던 히드로", 51.4700, -0.4543, "LHR"],
      ["파리 샤를드골", 49.0097, 2.5479, "CDG"],
      ["프랑크푸르트", 50.0379, 8.5622, "FRA"],
      ["뮌헨", 48.3538, 11.7861, "MUC"],
      ["두바이", 25.2532, 55.3657, "DXB"],
      ["싱가포르 창이", 1.3644, 103.9915, "SIN"],
      ["홍콩", 22.3080, 113.9185, "HKG"],
      ["방콕 수완나품", 13.6900, 100.7501, "BKK"],
      ["시드니", -33.9399, 151.1753, "SYD"]
    ];

    function addAirports() {
      airportLayer.clearLayers();

      airports.forEach(([name, lat, lon, code]) => {
        const icon = L.divIcon({
          html: `<div class="airport-icon">🛫</div>`,
          className: "",
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        L.marker([lat, lon], { icon })
          .bindPopup(`<b>${name}</b><br>공항코드: ${code}`)
          .addTo(airportLayer);
      });

      airportLayer.addTo(map);
    }

    function toggleAirports() {
      if (airportsVisible) {
        map.removeLayer(airportLayer);
        airportsVisible = false;
      } else {
        airportLayer.addTo(map);
        airportsVisible = true;
      }
    }

    function getRadiusByZoom() {
      const zoom = map.getZoom();
      if (zoom <= 4) return 250;
      if (zoom <= 6) return 180;
      if (zoom <= 8) return 120;
      if (zoom <= 10) return 80;
      return 50;
    }

    function formatNumber(value) {
      if (value === undefined || value === null || value === "") return "-";
      if (value === "ground") return "지상";
      const n = Number(value);
      if (Number.isNaN(n)) return value;
      return n.toLocaleString("ko-KR");
    }

    function createPlaneIcon(track = 0) {
      return L.divIcon({
        html: `<div class="plane-icon" style="transform: rotate(${track}deg)">✈️</div>`,
        className: "",
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });
    }

    function normalizeAircraft(json) {
      if (!json) return [];
      if (Array.isArray(json.aircraft)) return json.aircraft;
      if (Array.isArray(json.ac)) return json.ac;
      if (Array.isArray(json.planes)) return json.planes;
      if (Array.isArray(json)) return json;
      return [];
    }

    function proxyUrl(url) {
      return `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    function animateMarker(marker, from, to, duration = 9000) {
      const start = performance.now();

      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const ease = progress < 0.5
          ? 2 * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        const lat = from.lat + (to.lat - from.lat) * ease;
        const lng = from.lng + (to.lng - from.lng) * ease;

        marker.setLatLng([lat, lng]);

        if (progress < 1) requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    function getPlaneId(plane) {
      return plane.hex || plane.icao || plane.icao24 || plane.flight || plane.callsign || `${plane.lat}-${plane.lon}`;
    }

    function getPlaneFields(plane) {
      return {
        callsign: plane.flight || plane.callsign || plane.call || "호출부호 없음",
        altitude: plane.alt_baro || plane.alt_geom || plane.altitude || "-",
        speed: plane.gs || plane.speed || "-",
        track: plane.track || plane.heading || 0,
        type: plane.t || plane.type || plane.aircraft_type || "-",
        reg: plane.r || plane.reg || plane.registration || "-",
        hex: plane.hex || plane.icao || plane.icao24 || "-"
      };
    }

    function getImageKey(type, reg, hex) {
      if (reg && reg !== "-") return reg;
      if (type && type !== "-") return type;
      if (hex && hex !== "-") return hex;
      return "";
    }

    async function prefetchAircraftImage(type, reg, hex) {
      const key = getImageKey(type, reg, hex);
      if (!key) return;

      if (aircraftImageCache.has(key)) return;

      aircraftImageCache.set(key, "loading");

      const terms = [
        reg && reg !== "-" ? `${reg} aircraft` : "",
        type && type !== "-" ? `${type} aircraft` : "",
        type && type !== "-" ? `${type} airplane` : ""
      ].filter(Boolean);

      for (const term of terms) {
        try {
          const url =
            "https://commons.wikimedia.org/w/api.php" +
            "?action=query" +
            "&generator=search" +
            "&gsrnamespace=6" +
            `&gsrsearch=${encodeURIComponent(term)}` +
            "&prop=imageinfo" +
            "&iiprop=url" +
            "&iiurlwidth=420" +
            "&format=json" +
            "&origin=*";

          const res = await fetch(url);
          const json = await res.json();

          const pages = json.query && json.query.pages
            ? Object.values(json.query.pages)
            : [];

          const found = pages.find(p =>
            p.imageinfo &&
            p.imageinfo[0] &&
            p.imageinfo[0].thumburl
          );

          if (found) {
            aircraftImageCache.set(key, found.imageinfo[0].thumburl);
            return;
          }
        } catch (e) {
          console.warn("이미지 미리 불러오기 실패:", e);
        }
      }

      aircraftImageCache.set(key, "none");
    }

    function prefetchVisibleAircraftImages(aircraft) {
      const targets = aircraft.slice(0, 25);

      targets.forEach((plane, index) => {
        const { type, reg, hex } = getPlaneFields(plane);

        setTimeout(() => {
          prefetchAircraftImage(type, reg, hex);
        }, index * 120);
      });
    }

    function buildPopup(plane) {
      const { callsign, altitude, speed, track, type, reg, hex } = getPlaneFields(plane);
      const key = getImageKey(type, reg, hex);
      const cachedImage = aircraftImageCache.get(key);

      let imageHtml = `<div class="plane-card">✈️<br>이미지 준비 중<br>${type !== "-" ? type : ""}</div>`;

      if (cachedImage && cachedImage !== "loading" && cachedImage !== "none") {
        imageHtml = `<img class="plane-img" src="${cachedImage}" alt="aircraft image">`;
      }

      if (cachedImage === "none") {
        imageHtml = `<div class="plane-card">✈️<br>이미지 없음<br>${type !== "-" ? type : ""}</div>`;
      }

      const query = encodeURIComponent(`${type !== "-" ? type : ""} ${reg !== "-" ? reg : ""} aircraft`);

      return `
        <div class="popup">
          <b>${String(callsign).trim()}</b>
          ${imageHtml}
          ICAO: ${hex}<br>
          기종: ${type}<br>
          등록번호: ${reg}<br>
          고도: ${formatNumber(altitude)} ft<br>
          속도: ${formatNumber(speed)} kt<br>
          방향: ${formatNumber(track)}°<br>
          <a class="search-link" href="https://www.google.com/search?tbm=isch&q=${query}" target="_blank">이미지 검색</a>
        </div>
      `;
    }

    async function loadAircraft() {
      if (isLoadingAircraft) return;
      isLoadingAircraft = true;

      const center = map.getCenter();
      const radius = Math.min(getRadiusByZoom(), 250);

      statusEl.textContent = "항공기 데이터 불러오는 중...";

      const lat = center.lat.toFixed(4);
      const lon = center.lng.toFixed(4);

      const rawUrls = [
        `https://opendata.adsb.fi/api/v3/lat/${lat}/lon/${lon}/dist/${radius}`,
        `https://api.adsb.fi/v2/lat/${lat}/lon/${lon}/dist/${radius}`,
        `https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/${radius}`,
        `https://api.adsb.one/v2/lat/${lat}/lon/${lon}/dist/${radius}`
      ];

      const urls = [];
      rawUrls.forEach(url => {
        urls.push(url);
        urls.push(proxyUrl(url));
      });

      let aircraft = [];
      let successUrl = "";
      let lastError = "";

      for (const url of urls) {
        try {
          const json = await fetchJson(url);
          const list = normalizeAircraft(json);

          if (list.length > 0) {
            aircraft = list;
            successUrl = url.includes("allorigins") ? "프록시 API" : "직접 API";
            break;
          }

          lastError = "항공기 목록이 비어 있음";
        } catch (error) {
          lastError = error.message || "Failed to fetch";
        }
      }

      const seenIds = new Set();
      let visibleCount = 0;

      aircraft.forEach(plane => {
        const pLat = plane.lat ?? plane.latitude;
        const pLon = plane.lon ?? plane.lng ?? plane.longitude;
        if (!pLat || !pLon) return;

        visibleCount++;

        const id = String(getPlaneId(plane));
        seenIds.add(id);

        const { track } = getPlaneFields(plane);
        const newLatLng = L.latLng(pLat, pLon);

        let marker = aircraftMarkers.get(id);

        if (marker) {
          const oldLatLng = marker.getLatLng();
          animateMarker(marker, oldLatLng, newLatLng, 9000);
          marker.setIcon(createPlaneIcon(track));
          marker.setPopupContent(buildPopup(plane));
        } else {
          marker = L.marker(newLatLng, {
            icon: createPlaneIcon(track)
          }).addTo(aircraftLayer);

          marker.bindPopup(buildPopup(plane));
          aircraftMarkers.set(id, marker);
        }
      });

      aircraftMarkers.forEach((marker, id) => {
        if (!seenIds.has(id)) {
          aircraftLayer.removeLayer(marker);
          aircraftMarkers.delete(id);
        }
      });

      prefetchVisibleAircraftImages(aircraft);

      planeCountEl.textContent = visibleCount;
      lastUpdateEl.textContent = new Date().toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit"
      });

      if (visibleCount > 0) {
        statusEl.textContent = `완료. ${visibleCount}대 표시 중. 9초 이동 후 1초 대기합니다. 연결: ${successUrl}`;
      } else {
        statusEl.textContent = `항공기 데이터를 표시하지 못했습니다. 마지막 오류: ${lastError}`;
      }

      isLoadingAircraft = false;
    }

    function moveTo(lat, lon, zoom) {
      map.setView([lat, lon], zoom);
      setTimeout(loadAircraft, 700);
    }

    function goMyLocation() {
      if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 기능을 지원하지 않습니다.");
        return;
      }

      statusEl.textContent = "현재 위치 확인 중...";

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          map.setView([lat, lon], 9);
          loadAircraft();
        },
        () => {
          alert("위치 권한을 허용해야 내 주변 항공기를 볼 수 있습니다.");
          statusEl.textContent = "위치 권한이 거부되었습니다.";
        }
      );
    }

    map.on("moveend", () => {
      statusEl.textContent = "지도를 이동했습니다. 새로고침을 누르면 이 지역 항공기를 다시 불러옵니다.";
    });

    async function startLiveTracking() {
      await loadAircraft();

      setInterval(() => {
        loadAircraft();
      }, 10000);
    }

    addAirports();
    startLiveTracking();
  </script>
</body>
</html>
