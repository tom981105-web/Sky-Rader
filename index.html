<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Radar - 실시간 항공기 지도</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: white;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      width: 335px;
      max-width: calc(100vw - 32px);
      padding: 16px;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    p {
      margin: 0 0 12px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      padding: 10px;
      border-radius: 14px;
      background: rgba(30,41,59,0.92);
    }

    .stat b {
      display: block;
      font-size: 19px;
      color: #38bdf8;
    }

    .stat span {
      font-size: 12px;
      color: #94a3b8;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid rgba(148,163,184,0.3);
      background: #0f172a;
      color: #e2e8f0;
      padding: 9px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #1e293b;
    }

    .primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .plane-icon {
      font-size: 22px;
      transform-origin: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    .popup {
      min-width: 190px;
      font-size: 13px;
      line-height: 1.6;
    }

    .popup b {
      color: #0284c7;
      font-size: 15px;
    }

    @media (max-width: 640px) {
      .panel {
        top: 10px;
        left: 10px;
        right: 10px;
        width: auto;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <section class="panel">
    <h1>✈️ Sky Radar</h1>
    <p>전 세계 항공기 위치를 지도에 표시합니다.</p>

    <div class="stats">
      <div class="stat">
        <b id="planeCount">0</b>
        <span>표시 항공기</span>
      </div>
      <div class="stat">
        <b id="lastUpdate">-</b>
        <span>마지막 갱신</span>
      </div>
    </div>

    <div class="buttons">
      <button class="primary" onclick="loadAircraft()">새로고침</button>
      <button onclick="moveTo(37.4602, 126.4407, 8)">인천공항</button>
      <button onclick="moveTo(35.5494, 139.7798, 8)">하네다</button>
      <button onclick="moveTo(40.6413, -73.7781, 8)">뉴욕 JFK</button>
      <button onclick="moveTo(51.4700, -0.4543, 8)">히드로</button>
      <button onclick="goMyLocation()">내 주변</button>
    </div>

    <div class="status" id="status">지도를 불러오는 중...</div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map", {
      zoomControl: false
    }).setView([37.4602, 126.4407], 8);

    L.control.zoom({
      position: "bottomright"
    }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const aircraftLayer = L.layerGroup().addTo(map);

    const planeCountEl = document.getElementById("planeCount");
    const lastUpdateEl = document.getElementById("lastUpdate");
    const statusEl = document.getElementById("status");

    function getRadiusByZoom() {
      const zoom = map.getZoom();
      if (zoom <= 4) return 250;
      if (zoom <= 6) return 180;
      if (zoom <= 8) return 120;
      if (zoom <= 10) return 80;
      return 50;
    }

    function formatNumber(value) {
      if (value === undefined || value === null || value === "") return "-";
      if (value === "ground") return "지상";
      return Number(value).toLocaleString("ko-KR");
    }

    function createPlaneIcon(track = 0) {
      return L.divIcon({
        html: `<div class="plane-icon" style="transform: rotate(${track}deg)">✈️</div>`,
        className: "",
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    function normalizeAircraft(json) {
      if (!json) return [];

      if (Array.isArray(json.aircraft)) return json.aircraft;
      if (Array.isArray(json.ac)) return json.ac;
      if (Array.isArray(json.planes)) return json.planes;
      if (Array.isArray(json)) return json;

      return [];
    }

    function proxyUrl(url) {
      return `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return await response.json();
    }

    async function loadAircraft() {
      const center = map.getCenter();
      const radius = Math.min(getRadiusByZoom(), 250);

      statusEl.textContent = "항공기 데이터 불러오는 중...";
      aircraftLayer.clearLayers();

      const lat = center.lat.toFixed(4);
      const lon = center.lng.toFixed(4);

      const rawUrls = [
        `https://opendata.adsb.fi/api/v3/lat/${lat}/lon/${lon}/dist/${radius}`,
        `https://api.adsb.fi/v2/lat/${lat}/lon/${lon}/dist/${radius}`,
        `https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/${radius}`,
        `https://api.adsb.one/v2/lat/${lat}/lon/${lon}/dist/${radius}`
      ];

      const urls = [];

      rawUrls.forEach(url => {
        urls.push(url);
        urls.push(proxyUrl(url));
      });

      let aircraft = [];
      let successUrl = "";
      let lastError = "";

      for (const url of urls) {
        try {
          console.log("API 시도:", url);

          const json = await fetchJson(url);
          const list = normalizeAircraft(json);

          console.log("API 응답:", json);

          if (list.length > 0) {
            aircraft = list;
            successUrl = url.includes("allorigins") ? "프록시 API" : "직접 API";
            break;
          }

          lastError = "응답은 받았지만 항공기 목록이 비어 있음";
        } catch (error) {
          console.warn("API 실패:", url, error);
          lastError = error.message || "Failed to fetch";
        }
      }

      let visibleCount = 0;

      aircraft.forEach(plane => {
        const lat = plane.lat ?? plane.latitude;
        const lon = plane.lon ?? plane.lng ?? plane.longitude;

        if (!lat || !lon) return;

        visibleCount++;

        const callsign = plane.flight || plane.callsign || plane.call || "호출부호 없음";
        const altitude = plane.alt_baro || plane.alt_geom || plane.altitude || "-";
        const speed = plane.gs || plane.speed || "-";
        const track = plane.track || plane.heading || 0;
        const type = plane.t || plane.type || "-";
        const reg = plane.r || plane.reg || "-";
        const hex = plane.hex || plane.icao || plane.icao24 || "-";

        const marker = L.marker([lat, lon], {
          icon: createPlaneIcon(track)
        }).addTo(aircraftLayer);

        marker.bindPopup(`
          <div class="popup">
            <b>${String(callsign).trim()}</b><br>
            ICAO: ${hex}<br>
            기종: ${type}<br>
            등록번호: ${reg}<br>
            고도: ${formatNumber(altitude)} ft<br>
            속도: ${formatNumber(speed)} kt<br>
            방향: ${formatNumber(track)}°
          </div>
        `);
      });

      planeCountEl.textContent = visibleCount;
      lastUpdateEl.textContent = new Date().toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit"
      });

      if (visibleCount > 0) {
        statusEl.textContent = `완료. ${visibleCount}대 항공기를 표시했습니다. 연결 방식: ${successUrl}`;
      } else {
        statusEl.textContent = `항공기 데이터를 표시하지 못했습니다. 마지막 오류: ${lastError}`;
      }
    }

    function moveTo(lat, lon, zoom) {
      map.setView([lat, lon], zoom);
      setTimeout(loadAircraft, 700);
    }

    function goMyLocation() {
      if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 기능을 지원하지 않습니다.");
        return;
      }

      statusEl.textContent = "현재 위치 확인 중...";

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          map.setView([lat, lon], 8);
          loadAircraft();
        },
        () => {
          alert("위치 권한을 허용해야 내 주변 항공기를 볼 수 있습니다.");
          statusEl.textContent = "위치 권한이 거부되었습니다.";
        }
      );
    }

    map.on("moveend", () => {
      statusEl.textContent = "지도를 이동했습니다. 새로고침을 누르면 이 지역 항공기를 다시 불러옵니다.";
    });

    loadAircraft();

    setInterval(loadAircraft, 120000);
  </script>
</body>
</html>
